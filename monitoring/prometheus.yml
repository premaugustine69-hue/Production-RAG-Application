global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi-ai:8001']

  - job_name: 'enterprise-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['enterprise-api:8080']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
